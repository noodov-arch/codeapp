name: Build iOS IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      
      - name: Install CocoaPods dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi
      
      - name: Download/Verify XCFrameworks
        run: |
          # Create Resources directory structure if missing
          mkdir -p Resources/Term Resources/NodeJS Resources/PHP Resources/PythonAux Resources/llvm Resources/NMSSH
          
          # Check which frameworks are missing
          echo "Checking for required XCFrameworks..."
          MISSING_FRAMEWORKS=()
          
          for framework in \
            "Resources/Term/ios_system.xcframework" \
            "Resources/Term/curl_ios.xcframework" \
            "Resources/NMSSH.xcframework" \
            "Resources/Term/openssl.xcframework" \
            "Resources/Term/libssh2.xcframework" \
            "Resources/NodeJS/NodeMobile.xcframework" \
            "Resources/PHP/php.xcframework" \
            "Resources/Term/network_ios.xcframework" \
            "Resources/PythonAux/freetype.xcframework" \
            "Resources/Term/lg2.xcframework" \
            "Resources/llvm/ar.xcframework" \
            "Resources/llvm/link.xcframework" \
            "Resources/llvm/libLLVM.xcframework" \
            "Resources/llvm/lld.xcframework" \
            "Resources/llvm/clang.xcframework" \
            "Resources/llvm/nm.xcframework" \
            "Resources/llvm/dis.xcframework" \
            "Resources/llvm/llc.xcframework" \
            "Resources/llvm/lli.xcframework" \
            "Resources/llvm/opt.xcframework" \
            "Resources/Term/libssh2.xcframework" \
            "Resources/Term/ssh_cmd.xcframework" \
            "Resources/Term/files.xcframework" \
            "Resources/Term/awk.xcframework" \
            "Resources/Term/text.xcframework" \
            "Resources/Term/shell.xcframework" \
            "Resources/Term/tar.xcframework" \
            "Resources/PythonAux/libpng.xcframework" \
            "Resources/PythonAux/harfbuzz.xcframework"
          do
            if [ ! -d "$framework" ]; then
              MISSING_FRAMEWORKS+=("$framework")
            fi
          done
          
          if [ ${#MISSING_FRAMEWORKS[@]} -gt 0 ]; then
            echo "WARNING: Missing XCFrameworks:"
            printf '%s\n' "${MISSING_FRAMEWORKS[@]}"
            echo "Note: These frameworks need to be built or downloaded from your source"
          fi
      
      - name: Create ExportOptions.plist
        run: |
          mkdir -p build
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>generic/platform=iOS</string>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
              <key>uploadBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict/>
          </dict>
          </plist>
          EOF
      
      - name: List Xcode schemes
        run: |
          xcodebuild -list
      
      - name: Build for iOS
        run: |
          xcodebuild archive \
          -scheme "Code App" \
          -configuration Release \
          -derivedDataPath build \
          -archivePath build/CodeApp.xcarchive \
          -destination generic/platform=iOS \
          -allowProvisioningUpdates \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          PROVISIONING_PROFILE="" \
          OTHER_CODE_SIGN_FLAGS="--remove-signature"
      
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CodeApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -verbose
      
      - name: Locate IPA file
        run: |
          find build -name "*.ipa" -type f
          IPA_FILE=$(find build -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file not found after export"
            exit 1
          fi
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-iOS
          path: ${{ env.IPA_PATH }}
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.IPA_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-sidestore:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: CodeApp-iOS
      
      - name: Get IPA file info
        run: |
          ls -lh *.ipa
          echo "IPA file ready for SideStore deployment"
      
      - name: Upload to releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.ipa"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
