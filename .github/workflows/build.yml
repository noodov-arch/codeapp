name: Build iOS IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      
      - name: Install dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi
      
      - name: Create ExportOptions.plist
        run: |
          mkdir -p build
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>generic/platform=iOS</string>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
      
      - name: List Xcode schemes
        run: |
          xcodebuild -list
      
      - name: Build for iOS
        run: |
          xcodebuild archive \
            -scheme "Code App" \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/CodeApp.xcarchive \
            -destination generic/platform=iOS \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE="" \
            OTHER_CODE_SIGN_FLAGS="--remove-signature" || true
      
      - name: Export IPA
        if: success()
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CodeApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -verbose
      
      - name: Locate IPA file
        run: |
          find build -name "*.ipa" -type f
          IPA_FILE=$(find build -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "WARNING: IPA file not found"
            exit 0
          fi
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV
      
      - name: Upload IPA artifact
        if: env.IPA_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-iOS
          path: ${{ env.IPA_PATH }}
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && env.IPA_PATH != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.IPA_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-sidestore:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: CodeApp-iOS
      
      - name: Get IPA file info
        run: |
          ls -lh *.ipa || echo "No IPA files found"
          echo "IPA file ready for SideStore deployment"
      
      - name: Upload to releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.ipa"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
